plugins { id 'com.android.application' }

def envOr = { String k, String d -> def v = System.getenv(k); return (v == null || v.isEmpty()) ? d : v }
def vCode = Integer.parseInt(envOr('APP_VERSION_CODE', '1'))
def vName = envOr('APP_VERSION_NAME', '1.0')
def ksFile = envOr('KEYSTORE_FILE', 'keystore/release.keystore')
def ksPass = envOr('KEYSTORE_PASSWORD', 'none')
def kAlias = envOr('KEY_ALIAS', 'pa')
def kPass = envOr('KEY_PASSWORD', ksPass)

android {
    namespace 'io.github.ayayajay.pokemonauthority'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.ayayajay.pokemonauthority'
        minSdk 24
        targetSdk 35
        versionCode vCode
        versionName vName
    }
    signingConfigs {
        release {
            // the same key every build, so new versions install over old ones
            storeFile file(ksFile)
            storePassword ksPass
            keyAlias kAlias
            keyPassword kPass
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
