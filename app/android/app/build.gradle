plugins { id 'com.android.application' }
android {
    namespace 'io.github.ayayajay.pokemonauthority'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.ayayajay.pokemonauthority'
        minSdk 24
        targetSdk 35
        versionCode (System.getenv('APP_VERSION_CODE') ?: '1') as int
        versionName System.getenv('APP_VERSION_NAME') ?: '1.0'
    }
    signingConfigs {
        release {
            // the same key every build, so new versions install over old ones
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('KEY_ALIAS') ?: 'pa'
            keyPassword System.getenv('KEY_PASSWORD') ?: ''
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
