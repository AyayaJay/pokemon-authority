<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pokémon Authority — Battle Prototype</title>
<style>
html,body{margin:0;background:#081a45;color:#eaf1ff;font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overscroll-behavior:none}
#cv{display:none;margin:0 auto;touch-action:none;position:absolute;inset:0;margin:auto}
#setup{padding:12px;max-width:1200px;margin:0 auto}
h1{font-size:20px;margin:4px 0} h2{font-size:17px;margin:4px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:#2d6cdf;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer}
button.x{background:#a33;padding:4px 9px;margin-left:auto}
button.start{background:#e8a317;font-size:20px;padding:12px 28px}
select,input{font-size:14px;border-radius:6px;border:1px solid #567;padding:4px;background:#0f2557;color:#fff;max-width:100%}
.settings{background:#10265e;border-radius:10px;padding:10px;margin:10px 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:800px){.cols{grid-template-columns:1fr}}
.panel{background:#10265e;border-radius:10px;padding:10px}
.slot{background:#183476;border-radius:10px;padding:8px;margin-bottom:8px}
.shead{display:flex;gap:10px;align-items:center}
.pt{width:56px;height:56px;image-rendering:pixelated;background:#dfe9f7;border-radius:8px;object-fit:contain}
.nm{font-weight:800;font-size:17px;cursor:pointer;text-decoration:underline dotted}
.ty{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700;margin-right:4px}
.small{font-size:12px;opacity:.8}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0;font-size:13px;align-items:center}
.moves{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px}.moves select{width:100%}
.opts select{max-width:46vw}.settings select{max-width:100%;width:100%}
.cols>*{min-width:0}.panel{min-width:0;overflow:hidden}
#rot{display:none;position:fixed;inset:0;background:#081a45;color:#fff;z-index:20;align-items:center;justify-content:center;flex-direction:column;font-size:22px;text-align:center;gap:16px}
@media (orientation:portrait){body.inbattle #rot{display:flex}}
.startrow{text-align:center;margin:16px 0}.hint{opacity:.7;font-size:12px;margin-top:6px}
.rec{opacity:.8;font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9}
.picker{background:#10265e;border-radius:12px;padding:12px;width:min(720px,94vw);max-height:86vh;display:flex;flex-direction:column;gap:8px}
.picker input{flex:1;font-size:16px;padding:8px}
.plist{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pitem{display:flex;align-items:center;gap:6px;background:#183476;border-radius:8px;padding:4px;cursor:pointer;font-size:13px}
.pitem img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated}
</style></head><body>
